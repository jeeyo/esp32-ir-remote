name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tx-only:
    uses: esphome/workflows/.github/workflows/build.yml@main
    with:
      files: samples/m5stickc-plus-gree-ac-remote-tx-only/ac-remote.yaml
      esphome-version: latest
      release-version: ${{ github.ref_name }}
      release-summary: "ESP32 IR Remote — Gree AC controller (internal IR TX only) sample built on the beep_detector component"
      release-url: https://github.com/jeeyo/esphome-beep-detector
      combined-name: ac-remote-tx-only

  upload-tx-only:
    needs: build-tx-only
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@main
    permissions:
      contents: write
    with:
      version: ${{ needs.build-tx-only.outputs.version }}

  build-tx-rx:
    uses: esphome/workflows/.github/workflows/build.yml@main
    with:
      files: samples/m5stickc-plus-gree-ac-remote-tx-rx/ac-remote.yaml
      esphome-version: latest
      release-version: ${{ github.ref_name }}
      release-summary: "ESP32 IR Remote — Gree AC controller (Grove IR TX+RX) sample built on the beep_detector component"
      release-url: https://github.com/jeeyo/esphome-beep-detector
      combined-name: ac-remote-tx-rx

  upload-tx-rx:
    # Serialized after upload-tx-only: both jobs upload assets to the same GitHub
    # release for this tag via a non-atomic list/create/upload sequence in the
    # shared esphome/workflows upload action. Running them in parallel races on
    # that same release object (observed as a spurious 404 on delete/upload).
    needs: [build-tx-rx, upload-tx-only]
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@main
    permissions:
      contents: write
    with:
      version: ${{ needs.build-tx-rx.outputs.version }}
